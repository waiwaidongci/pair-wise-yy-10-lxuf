<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>批缝补灰与复阴准入台</title>
  <style>
    :root {
      --bg: #eef3f0;
      --panel: #ffffff;
      --ink: #1e2624;
      --muted: #62706b;
      --line: #ccd8d2;
      --teal: #1f6b68;
      --red: #a43f42;
      --amber: #aa7a24;
      --violet: #665c93;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { padding: 22px 28px 16px; border-bottom: 1px solid var(--line); background: #fbfdfb; display: flex; justify-content: space-between; gap: 18px; align-items: end; }
    h1 { margin: 0; font-size: 26px; }
    .sub, .meta { color: var(--muted); font-size: 13px; line-height: 1.55; }
    main { padding: 20px 28px 34px; display: grid; gap: 18px; }
    button, input, select, textarea { font: inherit; border-radius: 6px; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); padding: 9px 10px; background: #fff; color: var(--ink); }
    button { border: 0; background: var(--teal); color: #fff; padding: 9px 11px; cursor: pointer; min-height: 38px; }
    button.secondary { background: #5d6764; }
    button.warn { background: var(--amber); }
    button.danger { background: var(--red); }
    button.violet { background: var(--violet); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); }
    label.check { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink); }
    label.check input { width: auto; }
    .top { display: grid; grid-template-columns: 360px 1fr; gap: 18px; align-items: start; }
    .lower { display: grid; grid-template-columns: 1fr 1.1fr 1.3fr; gap: 18px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
    .panel h2 { margin: 0 0 12px; font-size: 17px; }
    form { display: grid; gap: 10px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .toolbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 12px 0; }
    .lists { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
    .mini { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #fbfdfb; min-height: 118px; }
    .mini h3, .panel-head { margin: 0 0 8px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .item { border: 1px solid #d7e0dc; border-left: 4px solid var(--teal); background: #fff; border-radius: 7px; padding: 9px; margin-bottom: 8px; cursor: pointer; }
    .item.overdue { border-left-color: var(--red); }
    .board { display: grid; grid-template-columns: repeat(4, minmax(185px, 1fr)); gap: 12px; overflow-x: auto; }
    .col { background: #f9fbf9; border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 320px; }
    .col h3 { display: flex; justify-content: space-between; margin: 0 0 10px; font-size: 15px; }
    .card-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .card-actions button { flex: 1; min-width: 74px; }
    .mini-btn { font-size: 12px; padding: 6px 8px; min-height: 30px; }
    .order-box { margin-top: 9px; padding: 8px; border: 1px dashed var(--line); border-radius: 7px; background: #f7faf8; }
    .orderline { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 4px; }
    .orderline.none { color: var(--muted); font-size: 13px; }
    .tag { display: inline-block; font-size: 11px; border-radius: 999px; padding: 2px 8px; color: #fff; white-space: nowrap; }
    .tag.teal { background: var(--teal); }
    .tag.red { background: var(--red); }
    .tag.amber { background: var(--amber); }
    .tag.violet { background: var(--violet); }
    .tag.muted { background: #8a9691; }
    .decision { margin-top: 7px; font-size: 12px; border-radius: 6px; padding: 6px 8px; }
    .decision.pass { background: #e5f0ea; color: var(--teal); }
    .decision.fail { background: #f7e7e7; color: var(--red); }
    .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; border: 1px solid #d7e0dc; border-radius: 7px; padding: 8px 9px; margin-bottom: 8px; background: #fff; }
    .row.off { opacity: .62; }
    .row-right { display: flex; align-items: center; gap: 8px; }
    .num { font-weight: 700; font-size: 15px; }
    .num.good { color: var(--teal); }
    .num.bad { color: var(--red); }
    .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .slot { border-radius: 8px; padding: 10px; border: 1px solid var(--line); display: grid; gap: 6px; }
    .slot h3 { margin: 0; font-size: 13px; }
    .slot.free { background: #f2f8f4; }
    .slot.busy { background: #fdf6ec; border-color: #e4cf9f; }
    .hist { display: flex; gap: 9px; padding: 7px 4px; border-bottom: 1px dashed var(--line); font-size: 13px; }
    .hist .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; background: #9bb3ab; flex: 0 0 auto; }
    .hist.pass .dot { background: var(--teal); }
    .hist.fail .dot, .hist.defect .dot { background: var(--red); }
    .hist.order .dot, .hist.slot .dot { background: var(--violet); }
    .hist.correct .dot { background: var(--amber); }
    .hist-list { max-height: 420px; overflow-y: auto; }
    dialog { border: 1px solid var(--line); border-radius: 8px; width: min(560px, calc(100vw - 24px)); padding: 0; }
    dialog::backdrop { background: rgba(0, 0, 0, 0.3); }
    .dialog-body { padding: 16px; display: grid; gap: 10px; }
    #dlgActions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
    .dlg-form { display: grid; gap: 10px; }
    .dlg-h { margin: 12px 0 6px; font-size: 14px; }
    .timeline { border-top: 1px solid var(--line); margin-top: 6px; max-height: 240px; overflow-y: auto; }
    .tl { padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
    .form-error { background: #f7e7e7; color: var(--red); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
    .form-warn { background: #fdf6ec; color: #7a5718; border-radius: 6px; padding: 8px 10px; font-size: 12px; line-height: 1.6; }
    .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
    #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: #20302c; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .2s; max-width: min(680px, calc(100vw - 30px)); }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.ok { background: var(--teal); }
    #toast.err { background: var(--red); }
    @media (max-width: 1100px) {
      .top, .lower { grid-template-columns: 1fr; }
    }
    @media (max-width: 980px) {
      header { display: block; padding: 18px; }
      main { padding: 16px; }
      .lists, .toolbar, .grid2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>批缝补灰与复阴准入台</h1>
      <div class="sub">每件作品仅一张未结束补灰单 · 批次停用或含水率超 12% 不得占阴干位 · 换人隔 24 小时两次称重、失重 0.2%–0.6% 且批缝闭合方准入金粉</div>
    </div>
    <button id="exportBtn" class="secondary">导出 JSON</button>
  </header>

  <main>
    <section class="top">
      <form id="workForm" class="panel">
        <h2>新增作品</h2>
        <div class="grid2">
          <label>胎体材质<input name="base" required placeholder="脱胎漆器"></label>
          <label>纹样主题<input name="theme" required placeholder="缠枝莲"></label>
        </div>
        <div class="grid2">
          <label>线条粗细<select name="line"><option>细线</option><option>中线</option><option>粗线</option><option>混合线</option></select></label>
          <label>贴线进度<input name="progress" type="number" min="0" max="100" value="25"></label>
        </div>
        <div class="grid2">
          <label>阴干日期<input name="dryDate" type="date" required></label>
          <label>交付日期<input name="delivery" type="date" required></label>
        </div>
        <div class="grid2">
          <label>金粉处理状态<select name="gold"><option>未处理</option><option>试扫粉</option><option>已上金粉</option></select></label>
          <label>当前状态<select name="status"><option>贴线中</option><option selected>待阴干</option><option>上金粉</option><option>待交付</option></select></label>
        </div>
        <label>缺陷位置<input name="defect" placeholder="右下花瓣断线"></label>
        <label>备注<textarea name="note" placeholder="客户偏好、修补记录"></textarea></label>
        <button type="submit">加入工坊</button>
      </form>

      <section class="panel">
        <h2>今日与风险</h2>
        <div class="lists">
          <div class="mini"><h3>今日待阴干</h3><div id="todayDry"></div></div>
          <div class="mini"><h3>缺陷作品</h3><div id="defectList"></div></div>
          <div class="mini"><h3>最近交付</h3><div id="deliveryList"></div></div>
        </div>
        <div class="toolbar">
          <label>主题筛选<input id="themeFilter" placeholder="输入纹样"></label>
          <label>状态筛选<select id="statusFilter"></select></label>
          <label>排序<select id="sortMode"><option value="delivery">按交付日期</option><option value="dry">按阴干日期</option></select></label>
          <button id="clearFilters" type="button" class="secondary">清空</button>
        </div>
        <div id="board" class="board"></div>
      </section>
    </section>

    <section class="lower">
      <section class="panel">
        <div class="panel-head"><h2>补灰批次</h2><button id="addBatchBtn" type="button" class="mini-btn">新增批次</button></div>
        <div id="batchList"></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>阴干柜位</h2><span class="meta">占用需批次启用且含水率 ≤ 12%</span></div>
        <div id="slotList" class="slots"></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>统一履历</h2><span class="meta">看板 / 柜位 / 履历刷新后一致</span></div>
        <div id="historyList" class="hist-list"></div>
      </section>
    </section>
  </main>

  <dialog id="dlg">
    <div class="dialog-body">
      <h2 id="dlgTitle" style="margin:0;font-size:17px"></h2>
      <div id="dlgBody"></div>
      <div id="dlgActions"></div>
    </div>
  </dialog>
  <div id="toast"></div>

  <script src="js/rules.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/page.js"></script>
  <script>
    // 新增作品表单默认日期
    (function () {
      var form = document.getElementById("workForm");
      form.dryDate.value = new Date().toISOString().slice(0, 10);
      form.delivery.value = new Date(Date.now() + 5 * 86400000).toISOString().slice(0, 10);
    })();
  </script>
</body>
</html>
