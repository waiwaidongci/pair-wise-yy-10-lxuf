<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>批缝补灰与复阴准入台 · 小型漆线雕工坊</title>
  <style>
    :root {
      --bg: #eef3f0;
      --panel: #ffffff;
      --ink: #1e2624;
      --muted: #62706b;
      --line: #ccd8d2;
      --teal: #1f6b68;
      --red: #a43f42;
      --amber: #aa7a24;
      --violet: #665c93;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { padding: 22px 28px 16px; border-bottom: 1px solid var(--line); background: #fbfdfb; display: flex; justify-content: space-between; gap: 18px; align-items: end; }
    h1 { margin: 0; font-size: 26px; }
    .sub, .meta { color: var(--muted); font-size: 13px; line-height: 1.55; }
    main { padding: 20px 28px 34px; display: grid; gap: 18px; }
    button, input, select, textarea { font: inherit; border-radius: 6px; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); padding: 9px 10px; background: #fff; color: var(--ink); }
    textarea { min-height: 60px; resize: vertical; }
    button { border: 0; background: var(--teal); color: #fff; padding: 9px 11px; cursor: pointer; min-height: 38px; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.secondary { background: #5d6764; }
    button.warn { background: var(--amber); }
    button.danger { background: var(--red); }
    button.violet { background: var(--violet); }
    label { display: grid; gap: 5px; font-size: 12px; color: var(--muted); }
    .top { display: grid; grid-template-columns: 360px 1fr; gap: 18px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
    .panel h2 { margin: 0 0 12px; font-size: 17px; }
    form { display: grid; gap: 10px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 10px; margin: 12px 0; align-items: end; }
    .lists { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .mini { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: #fbfdfb; min-height: 118px; }
    .mini h3 { margin: 0 0 8px; font-size: 14px; display: flex; justify-content: space-between; }
    .item { border: 1px solid #d7e0dc; border-left: 4px solid var(--teal); background: #fff; border-radius: 7px; padding: 9px; margin-bottom: 8px; cursor: pointer; }
    .item.overdue { border-left-color: var(--red); }
    .board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; }
    .col { background: #f9fbf9; border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 320px; }
    .col h3 { display: flex; justify-content: space-between; margin: 0 0 10px; font-size: 15px; }
    .actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
    .actions button { flex: 1; min-width: 82px; font-size: 12px; padding: 7px 8px; min-height: auto; }
    dialog { border: 1px solid var(--line); border-radius: 8px; width: min(680px, calc(100vw - 24px)); padding: 0; max-height: calc(100vh - 32px); }
    dialog::backdrop { background: rgba(0, 0, 0, 0.3); }
    .dialog-body { padding: 16px; display: grid; gap: 10px; overflow-y: auto; max-height: calc(100vh - 32px); }
    .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }

    /* 补灰批次 */
    #batchList { display: grid; gap: 10px; }
    .batch-row { border: 1px solid var(--line); border-radius: 7px; padding: 9px; background: #fbfdfb; display: grid; gap: 7px; }
    .batch-row.off { opacity: .7; }
    .batch-row.blocked { border-color: #d7a7a8; background: #fdf7f7; }
    .batch-head { display: flex; justify-content: space-between; align-items: center; }
    .reason { color: var(--red); font-size: 12px; margin-top: 3px; }
    .bad-text { color: var(--red); }
    .ok-text { color: var(--teal); font-weight: 600; }

    /* 看板卡片上的补灰单片段 */
    .order-box { border: 1px dashed #b9c8c2; border-radius: 7px; background: #f5f9f7; padding: 8px; margin: 8px 0; display: grid; gap: 4px; cursor: default; }
    .order-box.none { background: #f7f8f8; }
    .order-box.pass { border: 1px solid var(--teal); background: #eef7f4; }
    .order-head { font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .weigh-line { font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px; }
    .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 20px; background: #e3eae6; color: #44504c; }
    .badge.ok { background: #dcefe8; color: var(--teal); }
    .badge.bad { background: #f5dcdd; color: var(--red); }
    .badge.stale { background: #f0e7cf; color: var(--amber); }
    .badge.violet-badge { background: #e5e1f0; color: var(--violet); }

    /* 柜位 */
    #slots { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
    .slot { border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-height: 84px; }
    .slot.free { background: #f7faf8; border-style: dashed; }
    .slot.busy { background: #eef4f2; border-left: 4px solid var(--teal); cursor: pointer; }
    .slot.bad-slot { background: #fdf3f3; border-left: 4px solid var(--red); cursor: pointer; }
    .slot-id { font-weight: 600; margin-bottom: 4px; }

    /* 履历 */
    #history { display: grid; gap: 6px; max-height: 280px; overflow-y: auto; }
    .hist-row { display: grid; grid-template-columns: auto 150px 110px 1fr; gap: 8px; align-items: baseline; font-size: 13px; padding: 5px 7px; border-bottom: 1px solid #e5ece8; cursor: pointer; }
    .hist-time { color: var(--muted); font-size: 12px; }
    .logbox { max-height: 190px; overflow-y: auto; border: 1px solid #e5ece8; border-radius: 6px; padding: 8px; background: #fbfdfb; display: grid; gap: 3px; }
    .hist-line { font-size: 12.5px; color: var(--ink); display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
    .hist-line .hist-time { min-width: 140px; }

    .dlg-section { border-top: 1px solid #e5ece8; padding-top: 10px; display: grid; gap: 8px; }
    .dlg-section h3 { margin: 0; font-size: 14px; }
    .dlg-order h3 { margin: 0 0 6px; font-size: 14px; }
    .weigh-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .weigh-table th, .weigh-table td { border: 1px solid var(--line); padding: 5px 7px; text-align: left; }
    .judge-box { background: #f6f8f7; border-radius: 7px; padding: 10px; }

    @media (max-width: 1100px) {
      #slots { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 980px) {
      header { display: block; padding: 18px; }
      header .actions-head { margin-top: 10px; }
      main { padding: 16px; }
      .top, .lists, .toolbar { grid-template-columns: 1fr; }
      .grid2 { grid-template-columns: 1fr; }
      .hist-row { grid-template-columns: 1fr; gap: 2px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>批缝补灰与复阴准入台</h1>
      <div class="sub">漆线雕作品流转 · 补灰批次含水率管控 · 换人隔 24 小时两次称重 · 复阴合格方准入金粉</div>
    </div>
    <div class="actions-head" style="display:flex;gap:8px">
      <span id="slotSummary" class="badge" style="align-self:center"></span>
      <button id="resetBtn" class="warn">恢复演示数据</button>
      <button id="exportBtn" class="secondary">导出 JSON</button>
    </div>
  </header>

  <main>
    <section class="top">
      <div style="display:grid;gap:18px">
        <form id="workForm" class="panel">
          <h2>新增作品</h2>
          <div class="grid2">
            <label>胎体材质<input name="base" required placeholder="脱胎漆器"></label>
            <label>纹样主题<input name="theme" required placeholder="缠枝莲"></label>
          </div>
          <div class="grid2">
            <label>线条粗细<select name="line"><option>细线</option><option>中线</option><option>粗线</option><option>混合线</option></select></label>
            <label>贴线进度<input name="progress" type="number" min="0" max="100" value="25"></label>
          </div>
          <div class="grid2">
            <label>阴干日期<input name="dryDate" type="date" required></label>
            <label>交付日期<input name="delivery" type="date" required></label>
          </div>
          <div class="grid2">
            <label>金粉处理状态<select name="gold"><option>未处理</option><option>试扫粉</option><option>已上金粉</option></select></label>
            <label>当前状态<select name="status"><option>贴线中</option><option selected>待阴干</option><option>上金粉</option><option>待交付</option></select></label>
          </div>
          <label>缺陷位置<input name="defect" placeholder="右下花瓣断线"></label>
          <label>备注<textarea name="note" placeholder="客户偏好、修补记录"></textarea></label>
          <button type="submit">加入工坊</button>
        </form>

        <section class="panel">
          <h2>补灰批次</h2>
          <div id="batchList"></div>
          <form id="batchForm" style="margin-top:10px">
            <div class="grid2">
              <label>批次名称<input name="batchName" required placeholder="瓦灰·秋用批"></label>
              <label>含水率（%）<input name="moisture" type="number" step="0.1" min="0" max="100" value="9" required></label>
            </div>
            <label>备注<input name="note" placeholder="批缝适用范围"></label>
            <button type="submit" class="secondary">新增批次</button>
          </form>
        </section>
      </div>

      <section class="panel">
        <h2>今日与风险</h2>
        <div class="lists">
          <div class="mini">
            <h3>今日待阴干</h3>
            <div id="todayDry"></div>
          </div>
          <div class="mini">
            <h3>缺陷作品</h3>
            <div id="defectList"></div>
          </div>
          <div class="mini">
            <h3>最近交付</h3>
            <div id="deliveryList"></div>
          </div>
        </div>
        <div class="toolbar">
          <label>主题筛选<input id="themeFilter" placeholder="输入纹样"></label>
          <label>状态筛选<select id="statusFilter"></select></label>
          <label>排序<select id="sortMode"><option value="delivery">按交付日期</option><option value="dry">按阴干日期</option></select></label>
          <button id="clearFilters" class="secondary">清空</button>
        </div>
        <div id="board" class="board"></div>
      </section>
    </section>

    <section class="panel">
      <h2>阴干柜位</h2>
      <div class="meta" style="margin-bottom:10px">
        规则：补灰批次停用或含水率 &gt; 12% 时不得占阴干位；准入未通过继续占位，准入金粉后释放柜位。
      </div>
      <div id="slots"></div>
    </section>

    <section class="panel">
      <h2>统一履历（作品流转 + 补灰单事件）</h2>
      <div id="history"></div>
    </section>
  </main>

  <dialog id="appDialog">
    <div class="dialog-body">
      <h2 id="dialogTitle" style="margin:0"></h2>
      <div id="dialogBody"></div>
    </div>
  </dialog>

  <script src="rules.js"></script>
  <script src="storage.js"></script>
  <script src="page.js"></script>
</body>
</html>
